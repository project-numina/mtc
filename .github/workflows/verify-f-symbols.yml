name: Verify F-symbol pentagons

on:
  push:
    branches: [codex/verify-ising-b03-00019]
  workflow_dispatch:
    inputs:
      atlas_target:
        description: Optional proposed Anyon Atlas record ID (such as B03-00019)
        type: string
        required: false
      input_b64:
        description: Base64 of the exact F-table JSON bytes (up to 48,000 bytes)
        type: string
        required: true
      input_sha256:
        description: Lowercase SHA-256 of the original file
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/verify-ising-b03-00019')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 4
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Fetch the verifier's mathlib dependencies
        shell: bash
        run: |
          lake query --json +MTC.FRSymbols.PentagonTable:transImports |
            jq -r '.[] | select(startswith("Mathlib."))' |
            xargs -r lake exe cache get
      - name: Verify the pinned Ising example
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "65bdc7cc721f74471538ab9871faa9648328083fcfc3967a9c5b6be32b6270c6  MTC/FRSymbols/Ising.json" | sha256sum --check
          python3 scripts/submit_f_symbols.py MTC/FRSymbols/Ising.json \
            --atlas-target B03-00019 --local "$RUNNER_TEMP/pentagon-verified"
      - name: Verify the submitted bytes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          jq -c '.inputs' "$GITHUB_EVENT_PATH" |
            python3 scripts/verify_f_symbol_submission.py "$RUNNER_TEMP/pentagon-verified"
      - name: Save the checked table and proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pentagon-verified-${{ inputs.input_sha256 || '65bdc7cc721f74471538ab9871faa9648328083fcfc3967a9c5b6be32b6270c6' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pentagon-verified/
          if-no-files-found: error
