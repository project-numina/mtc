name: Verify F-symbol pentagons

on:
  workflow_dispatch:
    inputs:
      atlas_target:
        description: Optional proposed Anyon Atlas record ID (such as B03-00019)
        type: string
        required: false
      input_b64:
        description: Base64 of the exact F-table JSON bytes (up to 48,000 bytes)
        type: string
        required: true
      input_sha256:
        description: Lowercase SHA-256 of the original file
        type: string
        required: true

  workflow_call:
    inputs:
      atlas_target:
        description: Optional proposed Anyon Atlas record ID (such as B03-00019)
        type: string
        required: false
      input_b64:
        description: Base64 of the exact F-table JSON bytes (up to 48,000 bytes)
        type: string
        required: true
      input_sha256:
        description: Lowercase SHA-256 of the original file
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.verify.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.verify.outputs.artifact_digest }}

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 4
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Fetch the verifier's mathlib dependencies
        shell: bash
        run: |
          lake query --json +MTC.FRSymbols.PentagonTable:transImports |
            jq -r '.[] | select(startswith("Mathlib."))' |
            xargs -r lake exe cache get
      - name: Verify the submitted bytes
        shell: bash
        env:
          SUBMISSION_INPUTS: ${{ toJSON(inputs) }}
        run: |
          printf '%s' "$SUBMISSION_INPUTS" |
            python3 scripts/verify_f_symbol_submission.py "$RUNNER_TEMP/pentagon-verified"
      - name: Save the checked table and proof
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pentagon-verified-${{ inputs.input_sha256 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pentagon-verified/
          if-no-files-found: error
